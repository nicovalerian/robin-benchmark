# ROBIN Benchmark - Full Configuration
# This file configures all phases of the benchmark pipeline

# =============================================================================
# Dataset Configuration (Phase 1)
# =============================================================================
dataset:
  # Primary source dataset (Indonesian Alpaca, cleaned)
  source: "ilhamfadheel/alpaca-cleaned-indonesian"

  # Target benchmark size: 750 base instructions × 4 perturbation levels = 3000 prompts
  target_size: 750
  
  # Seed for reproducibility
  random_seed: 42
  
  # Task categories with natural distribution weights
  categories:
    logical_reasoning:
      weight: 0.25
      keywords: ["logika", "deduksi", "silogisme", "kesimpulan", "premis"]
    mathematical_reasoning:
      weight: 0.20
      keywords: ["hitung", "matematika", "rumus", "angka", "persamaan"]
    creative_writing:
      weight: 0.20
      keywords: ["cerita", "puisi", "narasi", "kreatif", "tulis"]
    information_extraction:
      weight: 0.20
      keywords: ["rangkum", "ekstrak", "informasi", "fakta", "data"]
    coding:
      weight: 0.15
      keywords: ["kode", "program", "fungsi", "algoritma", "python"]

# =============================================================================
# Constraint Configuration
# =============================================================================
constraints:
  # Constraint types to inject (one per type per sample)
  types:
    - keyword  # Must include specific words
    - length   # Word count range
    - format   # Output format (JSON, numbered list, table, bullet list)

  # Keyword constraint settings
  keyword:
    min_keywords: 1
    max_keywords: 2
    sources:
      - response_based # Keywords from gold response (primary)
      - task_specific  # Category fallback only

  # Length constraint settings
  length:
    types:
      - word_count      # "Jawab dalam 50-100 kata"
    ranges:
      short: [20, 50]
      medium: [50, 150]
      long: [150, 300]

  # Format constraint settings
  format:
    types:
      - json            # "Jawab dalam format JSON."
      - numbered_list   # "Gunakan format daftar bernomor."
      - bullet_list     # "Gunakan format poin-poin."
      - table           # "Tampilkan jawaban dalam format tabel."

# =============================================================================
# Perturbation Configuration
# =============================================================================
perturbation:
  # Perturbations and gold references use the same Elice model and deployment.
  # GPT-5.6 Luna rejects temperature=0.0 and only accepts its default, so the
  # parameter is deliberately omitted and the deviation is recorded.
  prompts_path: "configs/perturbation_prompts.yaml"
  llm:
    provider: "elice"
    base_url: "https://mlapi.run/286e9158-d32e-436d-a23d-36b43fc8e68a"
    model_id: "gpt-5.6-luna"
    api_key_env: "ELICE_API_KEY"
    discover_model_id: true
    temperature: null
    protocol_deviation: "temperature omitted: endpoint rejects 0.0 and accepts only its default"
    max_output_tokens: 2048
    token_parameter: "max_completion_tokens"
    timeout_seconds: 240
    max_concurrency: 20
    max_retries: 6
    rate_limit_per_minute: 120
  gold_llm:
    provider: "elice"
    base_url: "https://mlapi.run/286e9158-d32e-436d-a23d-36b43fc8e68a"
    model_id: "gpt-5.6-luna"
    api_key_env: "ELICE_API_KEY"
    discover_model_id: true
    temperature: null
    protocol_deviation: "temperature omitted: endpoint rejects 0.0 and accepts only its default"
    max_output_tokens: 2048
    token_parameter: "max_completion_tokens"
    timeout_seconds: 240
  levels:
    0:
      name: "formal_indonesian"
      description: "Standard Bahasa Indonesia (control baseline)"
    1:
      name: "lexical_borrowing"
      description: "Absorbed English nouns, no morphological change"
    2:
      name: "morphological_fusion"
      description: "Indonesian affixes on English verb stems + EN connectors/discourse fillers"
    3:
      name: "intra_sentential_switching"
      description: "L2 + clause switching + ID-root EN-suffix + ID phonological respelling"

# =============================================================================
# Inference Configuration (Phase 2)
# =============================================================================
inference:
   # Generation parameters (deterministic)
   temperature: 0.0
   max_output_tokens: 1024
   # Timeout and retry settings
   timeout_seconds: 240
   max_retries: 6
   retry_delay: 2.0

   # Conservative starting point for independent Elice deployments.
   max_concurrent: 4
   rate_limit_per_minute: 30
   rate_limit_delay: 0.5

   # Six Elice deployments. Model IDs are authenticated against /v1/models and
   # pinned in the run manifest before inference begins.
   models:
      - name: "gemini-3.1-pro"
        provider: "elice"
        base_url: "https://mlapi.run/62e68635-5e4c-4490-a5d4-59528aec05d2"
        api_key_env: "ELICE_API_KEY"
        model_id: "google/gemini-3.1-pro-preview"
        discover_model_id: true
        token_parameter: "max_completion_tokens"

      - name: "nemotron-3-ultra"
        provider: "elice"
        base_url: "https://mlapi.run/ea1a1990-0eee-4bb0-849b-b22b18ffa68f"
        api_key_env: "ELICE_API_KEY"
        model_id: "nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4"
        discover_model_id: true
        token_parameter: "max_completion_tokens"
        extra_body:
          chat_template_kwargs:
            enable_thinking: false

      - name: "gpt-5.4-mini"
        provider: "elice"
        base_url: "https://mlapi.run/0afbecbc-8044-4e63-8e78-7cfcb48abc8a"
        api_key_env: "ELICE_API_KEY"
        model_id: "gpt-5.4-mini"
        discover_model_id: true
        token_parameter: "max_completion_tokens"

      - name: "claude-sonnet-4.6"
        provider: "elice"
        base_url: "https://mlapi.run/5c33e588-ebf5-4c86-92a9-f2c28b64a316"
        api_key_env: "ELICE_API_KEY"
        model_id: "claude-sonnet-4-6"
        discover_model_id: true
        token_parameter: "max_completion_tokens"

      - name: "gemini-3.6-flash"
        provider: "elice"
        base_url: "https://mlapi.run/6fa8f48b-1c6f-47df-9cde-58d08ec24c31"
        api_key_env: "ELICE_API_KEY"
        model_id: "gemini-3.6-flash"
        discover_model_id: true
        token_parameter: "max_completion_tokens"

      - name: "claude-sonnet-5"
        provider: "elice"
        base_url: "https://mlapi.run/e9a5f41b-fdda-44f2-9545-ed88c458da53"
        api_key_env: "ELICE_API_KEY"
        model_id: "claude-sonnet-5"
        discover_model_id: true
        temperature: null
        protocol_deviation: "temperature omitted: endpoint reports the parameter is deprecated"
        token_parameter: "max_completion_tokens"

# =============================================================================
# Evaluation Configuration (Phase 3)
# =============================================================================
evaluation:
  # Stream A: Objective Constraint Checker
  constraint_checker:
    enabled: true
    strict_mode: true  # Exact match for keywords
    
  # Stream B: Semantic Fidelity
  semantic_scorer:
    enabled: true
    metrics:
      - rouge_l
      - bert_score
    bert_model: "indobenchmark/indobert-base-p1"
    
  # Output settings
  output:
    format: ["json", "huggingface"]
    save_intermediate: true

# =============================================================================
# Analysis Configuration (Phase 4)
# =============================================================================
analysis:
  # Performance Drop Rate calculation
  pdr:
    baseline_level: 0  # Compare against clean Indonesian
    metrics: ["constraint_pass_rate", "semantic_score", "judge_rating"]
    
  # Fine-grained skill mapping
  skill_map:
    enabled: true
    dimensions:
      - category      # By task type
      - constraint    # By constraint type
      - model         # By model
      - level         # By perturbation level
      
  # Visualization
  visualization:
    radar_chart: true
    heatmap: true
    export_format: ["png", "pdf", "html"]

# =============================================================================
# Paths
# =============================================================================
paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_output: "data/output"
  results: "results"
  logs: "logs"
