    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    model_id: "deepseek/deepseek-v4-flash-0731"
    discover_model_id: true
    temperature: 0.0
    max_output_tokens: 1024
    token_parameter: "max_tokens"
    extra_body:
      reasoning:
        enabled: false
      provider:
        only:
          - "DeepInfra"
          - "Novita"
